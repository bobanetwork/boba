service: alchemy-pay-url-generator

provider:
  name: aws
  runtime: python3.9
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-2'}
  environment: ${file(env-${self:provider.stage}.yml)}

functions:
  generateUrl:
    handler: src/handler.generate_signed_url
    events:
      - http:
          path: generate_alchemypay_url
          method: post
          cors:  # <-- CORS! configuration
            origins: ${self:custom.corsOrigins.${self:provider.stage}}
    timeout: 30

  routescanL2Transaction:
    handler: src/routescan_handler.routescan_l2_transaction
    layers:
      - ${self:provider.environment.LAYER}
    events:
      - http:
          path: fetch_routescan_l2_transaction
          method: post
          cors:
            origins: ${self:custom.corsOrigins.${self:provider.stage}}
    timeout: 30

plugins:
  - serverless-python-requirements
  - serverless-offline
  - serverless-domain-manager
  - serverless-dotenv-plugin

package:
  patterns:
    - '!./**'
    - 'src/**'
    - 'requirements.txt'

custom:
  pythonRequirements:
    dockerizePip: true        # ensures Linux-compatible binaries
    layer: true
    layerName: python-deps          # optional, just for naming
    layerDescription: Python dependencies
    compatibleRuntimes:
      - python3.9

  serverless-offline:
    httpPort: 3000

  corsOrigins:
    dev:
      - https://staging.hub.boba.network
      - https://stagingv2.gateway.boba.network
      - http://localhost:3000
    mainnet:
      - https://hub.boba.network
      - https://gateway.boba.network

  customDomain:
    domainName: ${self:provider.environment.DOMAIN_NAME}       # 👈 Your subdomain here
    basePath: ''                      # '' means root path
    stage: ${self:provider.stage}
    createRoute53Record: true
    certificateName: ${self:provider.environment.CERTIFICATE_NAME}  # 👈 Must match ACM cert
    endpointType: REGIONAL

