version: '3.4'

# Boba Mainnet node using op-reth (execution) + op-node (consensus)
#
# Prerequisites:
#   1. Download and extract the reth snapshot (see boba-docs snapshot-downloads page).
#      Alternatively, generate the database from scratch using the init service below
#      and the scripts in scripts/geth-to-reth/.
#
#   2. Create a shared JWT secret:
#      openssl rand -hex 32 > jwt-secret.txt
#
#   3. Create a .env file with at minimum:
#      ETH1_HTTP=<L1 RPC URL>
#      ETH2_HTTP=<L1 beacon URL>
#      OP_NODE_VERSION=<op-node image tag>
#
# Boba is bundled in the upstream OP Labs op-reth image, but with a buggy
# bedrockBlock=0 (only OP Mainnet gets its real bedrock block; every other
# migrated chain is hardcoded to 0, which silently disables historical RPC
# forwarding). The chain spec is supplied via a mounted JSON file that
# patches bedrockBlock to the correct value. See chainspecs/README.md.
#
# op-reth is the only supported execution client. op-geth and op-erigon
# reached end-of-life on 2026-05-31 and are no longer supported.
#
# Optional legacy node: the "legacy-l2" service (l2geth) serves pre-Anchorage
# blocks and transactions for RPC methods the modern client cannot answer for
# historical blocks. It is disabled by default; enable it with the "legacy"
# profile:
#   docker compose -f docker-compose-boba-mainnet.yml --profile legacy up -d
# When running the legacy node, set HISTORICAL_RPC=http://legacy-l2:8545 in
# your .env so op-reth forwards pre-Anchorage queries to your local replica
# rather than defaulting to the public endpoint.

services:
  # One-time initialization: import state dump into op-reth.
  # Place your reth-state.jsonl and header.rlp in the reth-data directory first.
  # Run: docker compose -f docker-compose-boba-mainnet.yml run --rm init
  init:
    image: ${RETH_IMAGE:-us-docker.pkg.dev/oplabs-tools-artifacts/images/op-reth}:${RETH_VERSION:-v2.2.1}
    command: >
      init-state
      --chain=/config/boba.json
      --datadir=/db
      --without-ovm
      --header=/db/header.rlp
      /db/reth-state.jsonl
    volumes:
      - ./chainspecs/boba.json:/config/boba.json:ro
      - ${DATA_DIR:-./reth-data}:/db
    profiles:
      - init

  l2:
    image: ${RETH_IMAGE:-us-docker.pkg.dev/oplabs-tools-artifacts/images/op-reth}:${RETH_VERSION:-v2.2.1}
    command: >
      node
      --chain=/config/boba.json
      --datadir=/db
      --http
      --http.addr=0.0.0.0
      --http.port=8545
      --http.corsdomain=*
      --http.api=eth,debug,net,web3
      --ws
      --ws.addr=0.0.0.0
      --ws.port=8546
      --ws.origins=*
      --ws.api=eth,debug,net,web3
      --authrpc.addr=0.0.0.0
      --authrpc.port=8551
      --authrpc.jwtsecret=/config/jwt-secret.txt
      --rollup.sequencer-http=https://mainnet.boba.network
      --rollup.disable-tx-pool-gossip
      --rollup.historicalrpc=${HISTORICAL_RPC:-https://mainnet.boba.network}
    ports:
      - "8545:8545"
      - "8546:8546"
      - "8551:8551"
    volumes:
      - ./jwt-secret.txt:/config/jwt-secret.txt
      - ./chainspecs/boba.json:/config/boba.json:ro
      - ${DATA_DIR:-./reth-data}:/db

  op-node:
    depends_on:
      - l2
    image: ${OP_NODE_IMAGE:-us-docker.pkg.dev/oplabs-tools-artifacts/images/op-node}:${OP_NODE_VERSION:-v1.16.5}
    command: >
      op-node
      --l1=${ETH1_HTTP:-https://mainnet.gateway.tenderly.co}
      --l1.beacon=${ETH2_HTTP}
      --l2=http://l2:8551
      --l2.jwt-secret=/config/jwt-secret.txt
      --rollup.config=/config/rollup.json
      --rpc.addr=0.0.0.0
      --rpc.port=9545
      --p2p.bootnodes="enode://a38db98391708094dd679aacdd356efdbe10ad7c9ba4b87d8f4b79eb24ac26328e7fdf911f8c5c3b7786c2505bc77d896a0ecd1816bd56107592f728dcff3945@35.153.183.193:0?discport=30301,enode://a92b84bac2893ef868659364a6784a6eeb146cb04ec0bb3b1e9925f5bb895af9e1c50deaf0703ab26db366a3d82272e710e06d925cb0b7245129ed76d54ccac9@13.221.254.11:0?discport=30301"
    # Optional flags
    #  --p2p.ban.peers=false
    #  --p2p.priv.path=/config/p2p-node-key.txt
    #  --p2p.discovery.path=/p2p_discovery_db
    #  --p2p.peerstore.path=/p2p_peerstore_db
    ports:
      - "9545:9545"
    volumes:
      - ./jwt-secret.txt:/config/jwt-secret.txt
      - ./rollup-configs/boba-mainnet.json:/config/rollup.json:ro
    #  - ./p2p-node-key.txt:/config/p2p-node-key.txt
    #  - ./discovery:/p2p_discovery_db
    #  - ./peerstore:/p2p_peerstore_db
    restart: always

  # Optional pre-Anchorage (legacy) node. Disabled by default — enable with
  # the "legacy" profile. Serves historical blocks/transactions from before
  # the Anchorage migration that the modern op-reth client cannot answer.
  # The legacy geth db can be downloaded from
  #   https://boba-db.s3.us-east-2.amazonaws.com/mainnet/boba-mainnet-geth-db-legacy.tgz
  # and extracted into LEGACY_DATA_DIR (default ./legacy-data).
  legacy-l2:
    profiles:
      - legacy
    image: bobanetwork/l2geth:v0.9.5
    environment:
      CHAIN_ID: '288'
      NETWORK_ID: '288'
      NO_USB: 'true'
      NO_DISCOVER: 'true'
      DATADIR: '/root/.ethereum'
      GCMODE: 'archive'
      IPC_DISABLE: 'true'
      TARGET_GAS_LIMIT: '11000000'
      USING_OVM: 'true'
      RPC_ENABLE: 'true'
      RPC_ADDR: '0.0.0.0'
      RPC_PORT: '8545'
      RPC_API: eth,net,rollup,web3,debug
      RPC_CORS_DOMAIN: '*'
      RPC_VHOSTS: '*'
      WS: 'true'
      WS_ADDR: '0.0.0.0'
      WS_PORT: '8546'
      WS_API: 'eth,net,rollup,web3'
      WS_ORIGINS: '*'
      ROLLUP_BACKEND: 'l2'
      ROLLUP_VERIFIER_ENABLE: 'true'
      ROLLUP_READONLY: 'true'
      BLOCK_SIGNER_KEY: "6587ae678cf4fc9a33000cdbf9f35226b71dcc6a4684a31203241f9bcfd55d27"
      BLOCK_SIGNER_ADDRESS: "0x00000398232E2064F896018496b4b44b3D62751F"
      ROLLUP_ENFORCE_FEES: 'true'
      TURING_CREDIT_ADDRESS: "0xF8D2f1b0292C0Eeef80D8F47661A9DaCDB4b23bf"
      L2_BOBA_TOKEN_ADDRESS: "0xa18bF3994C0Cc6E3b63ac420308E5383f53120D7"
      BOBA_GAS_PRICE_ORACLE_ADDRESS: "0xeE06ee2F239d2ab11792D77f3C347d919ddA0d51"
    # Defaults sit above op-reth's 8545/8546. Override in .env if needed.
    ports:
      - ${LEGACY_L2_HTTP_PORT:-8547}:8545
      - ${LEGACY_L2_WS_PORT:-8548}:8546
    volumes:
      - ${LEGACY_DATA_DIR:-./legacy-data}:/root/.ethereum
    restart: always
